name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "qom-v*"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: go1.25.9
      CGO_ENABLED: "1"
      GOMODCACHE: /var/tmp/qom-gomodcache
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.9"
          cache: false

      - name: Prepare patched CometBFT and Cosmos SDK trees
        run: sh scripts/prepare-evmd-build.sh

      - name: Build evmd (release recipe, docs/validator-join.md section 3)
        working-directory: evmd
        run: |
          go build -trimpath -buildvcs=false -o build/evmd ./cmd/evmd
          strip build/evmd
          sha256sum build/evmd | tee build/evmd.sha256

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: evmd-linux-amd64-${{ github.sha }}
          path: |
            evmd/build/evmd
            evmd/build/evmd.sha256
          retention-days: 30
          if-no-files-found: error
